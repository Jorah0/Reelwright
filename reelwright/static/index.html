<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reelwright</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="side">
    <a class="brand" href="#/library" title="Reelwright"><img src="logo.svg" alt=""><span>Reel<b>wright</b></span></a>
    <div class="act" id="act"><button class="act-btn" id="act-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="act-pop"
        title="What Reelwright is doing — click for details"><i class="act-dot" aria-hidden="true"></i><span class="act-label" id="act-label" role="status" aria-live="polite">Ready</span><b class="act-n" id="act-n" hidden></b></button></div>
    <nav>
      <div class="grp" title="Step 1: Import"><b>①</b><span>Import</span></div>
      <a href="#/library" data-nav="library" title="Library"><i>▦</i><span>Library</span></a>
      <a href="#/sources" data-nav="sources" title="Channels"><i>◉</i><span>Channels</span></a>
      <a href="#/obs" data-nav="obs" title="OBS link"><i>⏺</i><span>OBS link</span></a>
      <div class="grp" title="Step 2: Find clips"><b>②</b><span>Find clips</span></div>
      <a href="#/editor" data-nav="editor" id="nav-editor" hidden title="Editor"><i>✂</i><span>Editor</span></a>
      <a href="#/review" data-nav="review" title="Review: keep or skip AI picks with the keyboard"><i>⧉</i><span>Review</span></a>
      <div class="grp" title="Step 3: Edit"><b>③</b><span>Edit</span></div>
      <a href="#/studio" data-nav="studio" id="nav-studio" hidden title="Clip Studio (last opened clip)"><i>✎</i><span>Clip Studio</span></a>
      <div class="grp" title="Step 4: Analyze"><b>④</b><span>Analyze</span></div>
      <a href="#/lab" data-nav="lab" title="Virality Lab"><i>✦</i><span>Virality Lab</span></a>
      <div class="grp" title="Step 5: Track"><b>⑤</b><span>Track</span></div>
      <a href="#/pipeline" data-nav="pipeline" title="Pipeline"><i>⇶</i><span>Pipeline</span></a>
      <a href="#/long" data-nav="long" title="Long form"><i>▬</i><span>Long form</span></a>
      <div class="grp" title="Step 6: Publish"><b>⑥</b><span>Publish</span></div>
      <a href="#/publish" data-nav="publish" title="Publish"><i>⇪</i><span>Publish</span></a>
      <a href="#/schedule" data-nav="schedule" title="Schedule"><i>▤</i><span>Schedule</span></a>
      <hr class="nav-div">
      <a href="#/jobs" data-nav="jobs" title="Activity"><i>⚙</i><span>Activity</span> <b class="badge" id="jobs-badge" hidden></b></a>
      <a href="#/models" data-nav="models" title="Models"><i>◈</i><span>Models</span></a>
      <a href="#/modellab" data-nav="modellab" title="Model Lab"><i>⚗</i><span>Model Lab</span></a>
      <a href="#/settings" data-nav="settings" title="Settings"><i>☰</i><span>Settings</span></a>
    </nav>
    <div class="side-foot" id="side-status"></div>
  </aside>
  <main id="view"></main>
  <div class="act-pop" id="act-pop" role="dialog" aria-label="Running and queued tasks" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script src="undo.js"></script>
  <script src="timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
