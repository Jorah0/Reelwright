<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Reelwright phone simulator</title>
  <style>
    :root { --bg: #0b0c10; --panel: #13141b; --line: #262836; --text: #eceef6; --muted: #8b90a8; --accent: #ff6a3d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, "Segoe UI", sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header b { margin-right: auto; }
    select, button { min-height: 36px; background: #0d0e14; color: var(--text); border: 1px solid #33364a; border-radius: 9px; padding: 0 10px; font: inherit; }
    button.on { border-color: var(--accent); color: var(--accent); }
    .stage { display: grid; place-items: center; padding: 24px; }
    .phone { position: relative; background: #000; border: 12px solid #1c1d26; border-radius: 46px; box-shadow: 0 20px 60px #000c, 0 0 0 2px #33364a; overflow: hidden; }
    .phone.tablet { border-radius: 30px; border-width: 16px; }
    .phone.notch::before { content: ""; position: absolute; z-index: 2; top: 8px; left: 50%; width: 118px; height: 32px; margin-left: -59px; border-radius: 20px; background: #000; pointer-events: none; }
    .phone.home::after { content: ""; position: absolute; z-index: 2; bottom: 7px; left: 50%; width: 130px; height: 5px; margin-left: -65px; border-radius: 9px; background: #ffffffaa; pointer-events: none; }
    iframe { display: block; border: 0; background: var(--bg); }
    p { color: var(--muted); text-align: center; margin: 0 16px 20px; font-size: 12.5px; }
  </style>
</head>
<body>
  <header>
    <b>Phone simulator</b>
    <label>Device <select id="dev" aria-label="Device"></select></label>
    <button type="button" id="rot" aria-label="Rotate">⟳ Rotate</button>
    <label>Network <select id="net" aria-label="Network"><option value="fast">Wi-Fi</option><option value="slow">Slow (1.5 s)</option><option value="offline">Offline</option></select></label>
    <button type="button" id="reload">↻ Reload</button>
  </header>
  <div class="stage"><div class="phone" id="phone"><iframe id="app" title="Reelwright phone app"></iframe></div></div>
  <p>The real phone app, from this PC's phone-remote listener through its signed API. Only this PC can open it, and only while
    Settings → Phone remote → Developer: phone simulator is on.</p>
  <script src="sim.js"></script>
</body>
</html>
